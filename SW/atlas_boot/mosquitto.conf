listener 1883
allow_anonymous true
# Existing clients do not send credentials. The service restricts source IPs
# to loopback and the configured camera board; verify this on the target kernel.
persistence false
max_packet_size 1048576
message_size_limit 65536
max_queued_messages 100
max_connections 20
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
