name: SafeHub source checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'integration/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts-and-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install lightweight source-check dependencies
        run: python -m pip install -r tools/requirements-checks.txt -r SW/rpi4_sign_python/requirements-test.txt
      - name: Check current sources, notices and host preparation
        run: |
          python tools/audit_product_sources.py
          python -m unittest discover -s SW/safehub_scenario/tool -p 'test_*.py' -v
          python -m unittest discover -s SW/windows_preview -p 'test_*.py' -v
          python -m unittest discover -s SW/atlas_boot -p 'test_*.py' -v
      - name: Test context and actuator contracts without hardware
        run: |
          python -m unittest discover -s SW/fasttext_context/tests -p 'test_*.py' -v
          python -m unittest discover -s SW/tts_server/tests -p 'test_*.py' -v
          python -m unittest discover -s SW/uno_bridge/tests -p 'test_*.py' -v
          python -m unittest discover -s SW/rpi4_vision_atlas/tests -p 'test_*.py' -v
          python -m unittest discover -s SW/rpi4_sign_python/tests -p 'test_*.py' -v
      - name: Run approved hub scripts with Python network calls disabled
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/run_hub_checks.py
          python -m unittest discover -s tools/manual_fall_demo -p 'test_*.py' -v
      - name: Prepare host geometry test dependencies (no models or SDK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopencv-core-dev libopencv-imgproc-dev
          python - <<'PY_HEADERS'
          import hashlib, json, os
          from pathlib import Path
          from urllib.request import urlopen
          target = Path(os.environ['RUNNER_TEMP']) / 'ort-test-headers'
          target.mkdir()
          for name, spec in json.loads(Path('tools/sign_regressions/ort_test_headers.json').read_text()).items():
              data = urlopen(spec['url'], timeout=30).read()
              assert hashlib.sha256(data).hexdigest() == spec['sha256'], name
              (target / name).write_bytes(data)
          PY_HEADERS
      - name: Build and run host C++ sign regressions
        run: |
          cmake -S tools/sign_regressions -B "$RUNNER_TEMP/sign-build" -DCMAKE_BUILD_TYPE=Release -DOPENCV_INCLUDE_ROOT=/usr/include/opencv4 -DORT_HEADERS="$RUNNER_TEMP/ort-test-headers"
          cmake --build "$RUNNER_TEMP/sign-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/sign-build" --output-on-failure

  audio-and-csi-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated audio test dependencies
        run: python -m pip install -r SW/yamnet_alarm/requirements.txt -r SW/tts_server/requirements-test.txt
      - name: Check shared PCM, alarm references and CSI fall policy
        run: |
          python -m unittest discover -s SW/yamnet_alarm/tests -p 'test_*.py' -v
          python -m unittest discover -s SW/wifi_sensing/tests -p 'test_fall_detection.py' -v

  flutter-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          test "$(git -C "$RUNNER_TEMP/flutter-sdk" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          printf '%s\n' "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Prepare current UI host
        run: python3 SW/safehub_scenario/tool/prepare_host_tests.py "$RUNNER_TEMP/safehub-host"
      - name: Resolve reviewed host lock
        working-directory: ${{ runner.temp }}/safehub-host
        run: flutter pub get --enforce-lockfile
      - name: Run full product UI regression
        working-directory: ${{ runner.temp }}/safehub-host
        run: flutter test --no-pub --reporter expanded
      - name: Analyze (errors and warnings fatal, style info reported)
        working-directory: ${{ runner.temp }}/safehub-host
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Prepare hardware-free product web host
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'SW/safehub_scenario/tool')
          from run_ui_preview import prepare_host
          prepare_host(Path(os.environ['RUNNER_TEMP']) / 'safehub-web')
          PY
      - name: Build product web preview
        working-directory: ${{ runner.temp }}/safehub-web
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --no-pub --dart-define=APP_LOCAL_PREVIEW=true --dart-define=SAFEHUB_DEVELOPER_TOOLS=false --no-web-resources-cdn
      - name: Run actual Chrome product preview smoke test
        working-directory: ${{ runner.temp }}/safehub-web
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          mkdir -p test
          cp "$GITHUB_WORKSPACE/SW/safehub_scenario/tool/web_preview_smoke_test.dart" test/web_preview_smoke_test.dart
          flutter test --no-pub --platform chrome --dart-define=APP_LOCAL_PREVIEW=true --dart-define=SAFEHUB_DEVELOPER_TOOLS=false test/web_preview_smoke_test.dart
